name: Complete Prestige source copy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  complete-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out copied source
        uses: actions/checkout@v4

      - name: Download original hero video
        run: |
          mkdir -p public/videos
          curl --fail --location --retry 3 \
            https://propuestaprestige.lovable.app/videos/prestige-hero-scroll.mp4 \
            --output public/videos/prestige-hero-scroll.mp4
          test "$(stat -c%s public/videos/prestige-hero-scroll.mp4)" -eq 6253940

      - name: Finalize copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/prestige-hero-scroll.mp4
          git rm .github/workflows/complete-source-copy.yml
          git commit -m "Complete source copy with hero video"
          git push
